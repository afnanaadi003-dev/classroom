                const saved = localStorage.getItem('c1000_assignments');
                return saved ? JSON.parse(saved) : initialAssignments;

                localStorage.setItem('c1000_discussions', JSON.stringify(discussions));

                } else {
                    document.documentElement.classList.remove('dark');
                }

                setToastMessage(msg);
                setTimeout(() => setToastMessage(null), 3500);
            };

            const toggleTheme = () => {
                setTheme(prev => prev === 'light' ? 'dark' : 'light');
                showToast(`Switched to ${theme === 'light' ? 'Dark' : 'Light'} mode`);
            };

                setCourses(prev => prev.map(c => c.id === courseId ? { ...c, enrolled: true, progress: 10 } : c));
                showToast('Successfully enrolled in course!');
            };

            const openCoursePlayer = (course) => {
                setSelectedCoursePlayer(course);
                setActiveLesson(course.modules[0]);
                setActiveTab('player');
            };

            const toggleLessonComplete = (lessonId) => {
                if (!selectedCoursePlayer) return;
                const updatedModules = selectedCoursePlayer.modules.map(m => m.id === lessonId ? { ...m, completed: !m.completed } : m);
                const completedCount = updatedModules.filter(m => m.completed).length;
                const newProgress = Math.round((completedCount / updatedModules.length) * 100);

                const updatedCourse = { ...selectedCoursePlayer, modules: updatedModules, progress: newProgress };
                setSelectedCoursePlayer(updatedCourse);
                setCourses(prev => prev.map(c => c.id === updatedCourse.id ? updatedCourse : c));
                showToast('Lesson progress updated!');

                                { id: 'courses', label: 'Catalog', icon: 'book' },
                                { id: 'assignments', label: 'Assignments', icon: 'clipboard' },

                        {activeTab === 'discussions' && (
                            <div className="space-y-6">
                                <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                    <div>
                                        <h2 className="text-2xl font-extrabold">Q&A Discussion Whiteboard</h2>
                                        <p className="text-sm text-slate-400">Collaborate with peers, ask questions, and engage with instructors</p>
                                    </div>
                                    <button
                                        onClick={() => setNewDiscussionModal(true)}
                                        className="bg-brand-600 hover:bg-brand-700 text-white font-semibold px-5 py-2.5 rounded-xl text-sm transition shadow flex items-center gap-2"
                                    >
                                        <Icon name="plus" className="w-4 h-4" /> Ask Question
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    {discussions.map(disc => (
                                        <div key={disc.id} className="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
                                            <div className="flex items-start justify-between">
                                                <div className="flex items-center gap-3">
                                                    <img src={disc.avatar} alt={disc.author} className="w-10 h-10 rounded-full" />
                                                    <div>
                                                        <h4 className="font-bold text-sm">{disc.author}</h4>
                                                        <p className="text-xs text-slate-400">{disc.timestamp}</p>
                                                    </div>
                                                </div>
                                                <div className="flex gap-2">
                                                    {disc.tags.map((t, idx) => (
                                                        <span key={idx} className="text-xs bg-slate-100 dark:bg-slate-700 px-2.5 py-1 rounded-full font-medium">{t}</span>
                                                    ))}
                                                </div>
                                            </div>
                                            <div>
                                                <h3 className="font-bold text-base mb-1">{disc.title}</h3>
                                                <p className="text-sm text-slate-600 dark:text-slate-300 leading-relaxed">{disc.content}</p>
                                            </div>
                                            <div className="flex items-center gap-4 pt-2 border-t border-slate-100 dark:border-slate-700 text-xs font-semibold text-slate-500">
                                                <button
                                                    onClick={() => {
                                                        setDiscussions(prev => prev.map(d => d.id === disc.id ? { ...d, upvotes: d.upvotes + 1 } : d));
                                                    }}
                                                    className="flex items-center gap-1.5 hover:text-brand-600"
                                                >
                                                    <Icon name="thumbup" className="w-4 h-4" /> {disc.upvotes} Upvotes
                                                </button>
                                                <span>💬 {disc.replies.length} Replies</span>
                                            </div>

                                            {/* Replies list */}
                                            {disc.replies.length > 0 && (
                                                <div className="pl-6 border-l-2 border-brand-500/30 space-y-3 mt-4">
                                                    {disc.replies.map(rep => (
                                                        <div key={rep.id} className="bg-slate-50 dark:bg-slate-700/30 p-4 rounded-xl space-y-1">
                                                            <div className="flex items-center justify-between">
                                                                <span className="font-bold text-xs text-brand-600 dark:text-brand-400">{rep.author}</span>
                                                                <span className="text-xs text-slate-400">{rep.timestamp}</span>
                                                            </div>
                                                            <p className="text-xs text-slate-600 dark:text-slate-300">{rep.content}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>

                                {/* New Discussion Modal */}
                                {newDiscussionModal && (
                                    <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                                        <div className="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full p-8 shadow-2xl space-y-4">
                                            <div className="flex items-center justify-between border-b pb-4 dark:border-slate-700">
                                                <h3 className="font-bold text-lg">Post to Discussion Board</h3>
                                                <button onClick={() => setNewDiscussionModal(false)} className="text-slate-400 font-bold">✕</button>
                                            </div>
                                            <div className="space-y-3">
                                                <label className="text-xs font-semibold">Title / Question</label>
                                                <input
                                                    type="text"
                                                    placeholder="What's on your mind?"
                                                    value={newDiscTitle}
                                                    onChange={e => setNewDiscTitle(e.target.value)}
                                                    className="w-full p-3 bg-slate-50 dark:bg-slate-700 border rounded-xl text-sm"
                                                />
                                                <label className="text-xs font-semibold">Details & Code Snippet</label>
                                                <textarea
                                                    rows="4"
                                                    placeholder="Provide context..."
                                                    value={newDiscContent}
                                                    onChange={e => setNewDiscContent(e.target.value)}
                                                    className="w-full p-3 bg-slate-50 dark:bg-slate-700 border rounded-xl text-sm"
                                                ></textarea>
                                                <button
                                                    onClick={() => {
                                                        if (!newDiscTitle) return;
                                                        const newPost = {
                                                            id: 'd' + Date.now(),
                                                            courseId: 'cs101',
                                                            author: 'Alex Mercer',
                                                            avatar: 'https://placehold.co/100x100/6366f1/ffffff?text=AM',
                                                            title: newDiscTitle,
                                                            content: newDiscContent,
                                                            timestamp: 'Just now',
                                                            upvotes: 1,
                                                            tags: [newDiscCategory],
                                                            replies: []
                                                        };
                                                        setDiscussions([newPost, ...discussions]);
                                                        setNewDiscussionModal(false);
                                                        setNewDiscTitle('');
                                                        setNewDiscContent('');
                                                        showToast('Question posted successfully!');
                                                    }}
                                                    className="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-3 rounded-xl transition shadow mt-2"
                                                >
                                                    Publish Post
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* ================= GRADEBOOK & ANALYTICS TAB ================= */}
                        {activeTab === 'gradebook' && (
                            <div className="space-y-6">
                                <div>
                                    <h2 className="text-2xl font-extrabold">Gradebook & Analytics</h2>
                                    <p className="text-sm text-slate-400">Visual progress tracking, GPA analytics, and earned achievement badges</p>
                                </div>

                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                    {/* Chart */}
                                    <div className="lg:col-span-2 bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
                                        <h3 className="font-bold text-lg">Course Grade Breakdown</h3>
                                        <div className="h-72">
                                            <canvas id="gpaChart"></canvas>
                                        </div>
                                    </div>

                                    {/* Achievement Badges */}
                                    <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
                                        <h3 className="font-bold text-lg">Achievement Badges 🏆</h3>
                                        <div className="grid grid-cols-2 gap-4">
                                            {[
                                                { title: 'AI Pioneer', desc: 'Completed neural network milestone', icon: '🤖' },
                                                { title: 'Code Ninja', desc: 'Submitted 5 full-stack apps', icon: '💻' },
                                                { title: 'Top Contributor', desc: '10+ upvoted Q&A answers', icon: '⭐' },
                                                { title: 'Streak Master', desc: '7 days active streak', icon: '🔥' },
                                            ].map((badge, idx) => (
                                                <div key={idx} className="bg-slate-50 dark:bg-slate-700/30 p-4 rounded-xl border border-slate-100 dark:border-slate-700 text-center space-y-1">
                                                    <div className="text-3xl">{badge.icon}</div>
                                                    <h4 className="font-bold text-xs mt-1">{badge.title}</h4>
                                                    <p className="text-[10px] text-slate-400">{badge.desc}</p>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 py-6 px-6 text-center text-xs text-slate-400">
                        <p>© 2026 Classroom - 1000 Virtual Learning Management System. All rights reserved.</p>
                    </footer>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
